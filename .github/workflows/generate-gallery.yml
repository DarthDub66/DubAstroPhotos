name: Generate Image List
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    # Cette ligne force l'utilisation de Node.js 24 pour éliminer l'avertissement
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Generate JSON list of images
      run: |
        echo "[" > images.json
        first=true
        for file in photos/*.{jpg,jpeg,png,JPG,JPEG,PNG}; do
          if [ -f "$file" ]; then
            if [ "$first" = true ]; then first=false; else echo "," >> images.json; fi
            echo "  \"$file\"" >> images.json
          fi
        done
        echo "]" >> images.json

    - name: Commit and Push changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add images.json
        git diff-index --quiet HEAD || git commit -m "Mise à jour automatique de la liste des photos"
        git push