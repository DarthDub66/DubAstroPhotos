name: Generate Image List
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Generate JSON list of images
      run: |
        echo "[" > images.json
        # Liste toutes les images dans le dossier (ex: dossier "photos")
        first=true
        for file in photos/*.{png,PNG,webp,WEBP}; do
          if [ -f "$file" ]; then
            if [ "$first" = true ]; then first=false; else echo "," >> images.json; fi
            echo "  \"$file\"" >> images.json
          fi
        done
        echo "]" >> images.json

    - name: Commit and Push changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add images.json
        git diff-index --quiet HEAD || git commit -m "Mise à jour automatique de la liste des photos"
        git push